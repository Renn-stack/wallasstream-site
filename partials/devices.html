<!-- ============================================================
     Device frames: shared hardware geometry
     ============================================================
     Three <symbol>s and the gradients they need. Every page that shows
     a Mac or an iPhone <use>es these, so the geometry ships once and
     can never drift between pages.

     THESE ARE FLAT ELEVATIONS. The 3/4 view is not drawn here; the
     perspective is applied by components.css, which stands the lid up
     and lays the deck down as two planes in one CSS 3D scene. That is
     why the deck is drawn STRAIGHT DOWN, as if you were above the
     machine looking at the keyboard: the foreshortening happens at
     render time.

     Drawing the perspective into the art instead would mean the screen
     became a quadrilateral, and a real screenshot cannot be poured into
     a quadrilateral without solving a homography per device size. Let
     the browser project both the chrome and the screenshot with the
     same matrix and they line up by construction.

     THE SCREEN RECT IS LOAD-BEARING. components.css positions the
     screenshot from it and connect-modes.js aims the Wi-Fi demo at the
     QR through the same numbers. Everything around it is free.

     The screenshot <img> covers the screen exactly, so anything drawn
     inside it is invisible in practice, which is why all the detail
     here is bezel, rail, hinge and deck. The glass sheen that sits OVER
     the screenshot is a CSS overlay, in components.css.

     WHY GRADIENTS AND NOT A PNG: these are hardware props behind real UI
     screenshots. Drawn, they stay sharp at any size, recolour with the
     page, weigh nothing and never need a 2x variant.
     ============================================================ -->

<!-- ============================================================
     LIGHTING
     ============================================================
     One warm lamp, high and to the RIGHT, in an otherwise dark room,
     the same light the rest of the page is lit by. That single decision
     drives every gradient below, and it is what the eye reads as "a
     photograph of an object" rather than "a drawing of one".

     Two rules it has to obey to stay convincing:

       · The body is nearly black. A rim light only reads as light if
         the surface it wraps is darker than it is. Bodies were a mid
         grey before, which left the edges looking like borders.

       · The rim FALLS OFF. It is hot at the top right corner and gone
         by the bottom left. A rim of even brightness all the way round
         is a stroke, and the eye knows it instantly.

     Highlights run warm-white to amber, not white: a specular takes the
     colour of the lamp, not of the metal.
     ============================================================ -->

<!-- Lid face: dark anodised aluminium, barely catching the room. -->
<linearGradient id="ws-alu" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#41454c" />
  <stop offset="0.35" stop-color="#26292e" />
  <stop offset="1" stop-color="#15171a" />
</linearGradient>

<!-- Both vertical edges roll away from the light. Laid over the face, it
     is what turns a flat slab into something with a thickness. -->
<linearGradient id="ws-alu-side" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#000" stop-opacity="0.55" />
  <stop offset="0.06" stop-color="#000" stop-opacity="0" />
  <stop offset="0.94" stop-color="#000" stop-opacity="0" />
  <stop offset="1" stop-color="#000" stop-opacity="0.45" />
</linearGradient>

<!-- The machined top edge under the lamp: hot towards the right, dying
     out before the far corner. Deliberately NOT symmetrical: a
     highlight centred on the object is the giveaway of a light that
     does not exist anywhere in particular. -->
<linearGradient id="ws-spec" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#A36029" stop-opacity="0.06" />
  <stop offset="0.42" stop-color="#F4C29A" stop-opacity="0.4" />
  <stop offset="0.84" stop-color="#FFE6C6" stop-opacity="0.92" />
  <stop offset="1" stop-color="#F2A464" stop-opacity="0.3" />
</linearGradient>

<!-- The rim itself: traced diagonally so the top-right corner burns and
     the bottom-left falls into shadow, which is the whole trick. -->
<linearGradient id="ws-rim" x1="1" y1="0" x2="0.12" y2="1">
  <stop offset="0" stop-color="#FFE6C6" stop-opacity="0.95" />
  <stop offset="0.16" stop-color="#F2A464" stop-opacity="0.78" />
  <stop offset="0.46" stop-color="#D07D39" stop-opacity="0.34" />
  <stop offset="0.72" stop-color="#A36029" stop-opacity="0.12" />
  <stop offset="1" stop-color="#000" stop-opacity="0.45" />
</linearGradient>

<!-- Deck front: the lit top lip, then the face falling into shadow.
     Kept well under the lid: a deck brighter than the screen half
     pulls the eye to the furniture instead of the product. -->
<linearGradient id="ws-alu-base" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#5f646d" />
  <stop offset="0.12" stop-color="#3a3e45" />
  <stop offset="0.58" stop-color="#24272c" />
  <stop offset="1" stop-color="#121416" />
</linearGradient>

<!-- The top edge of the deck. Same lamp, so the warmth pools to the
     right here too rather than sitting evenly across the front. -->
<linearGradient id="ws-lip" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#A36029" stop-opacity="0.18" />
  <stop offset="0.22" stop-color="#F4C29A" stop-opacity="0.34" />
  <stop offset="0.72" stop-color="#FFE6C6" stop-opacity="0.62" />
  <stop offset="1" stop-color="#F2A464" stop-opacity="0.24" />
</linearGradient>

<!-- Titanium rail, seen end-on: two thin edges where the curve turns
     back, a broad dark face between. The right edge faces the lamp and
     burns warm; the left one only picks up what the room gives back. -->
<linearGradient id="ws-ti" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#6b7079" />
  <stop offset="0.08" stop-color="#33373d" />
  <stop offset="0.45" stop-color="#43474e" />
  <stop offset="0.72" stop-color="#3a3e44" />
  <stop offset="0.9" stop-color="#8a6743" />
  <stop offset="1" stop-color="#FFDCB0" />
</linearGradient>

<!-- The top and bottom rails face the lamp more squarely than the long
     sides, so they take a wash the sides do not. -->
<linearGradient id="ws-ti-v" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFE6C6" stop-opacity="0.22" />
  <stop offset="0.13" stop-color="#fff" stop-opacity="0" />
  <stop offset="0.87" stop-color="#fff" stop-opacity="0" />
  <stop offset="1" stop-color="#F2A464" stop-opacity="0.12" />
</linearGradient>

<!-- Side buttons: rounded stock, catching the same warm top light. -->
<linearGradient id="ws-btn" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#c9a483" />
  <stop offset="0.5" stop-color="#4e535a" />
  <stop offset="1" stop-color="#2e3238" />
</linearGradient>

<!-- Deck surface, seen straight down. The open lid shades the back of
     it and the lamp reaches the front right, so the sheen runs corner
     to corner rather than straight down the page. -->
<linearGradient id="ws-deck" x1="0.08" y1="0" x2="0.92" y2="1">
  <stop offset="0" stop-color="#171a1e" />
  <stop offset="0.4" stop-color="#282c31" />
  <stop offset="0.78" stop-color="#3b4048" />
  <stop offset="1" stop-color="#4b505a" />
</linearGradient>

<linearGradient id="ws-key" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#282c31" />
  <stop offset="1" stop-color="#131518" />
</linearGradient>

<!-- One row of keys, reused down the keyboard. Fourteen rects defined
     once and <use>d five times is a fraction of the bytes of a full
     drawn keyboard, and at the angle this deck is seen from, nobody can
     tell that every row has the same key widths. -->
<g id="ws-keyrow">
  <rect x="160" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="209" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="258" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="307" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="356" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="405" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="454" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="503" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="552" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="601" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="650" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="699" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="748" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
  <rect x="797" y="0" width="44" height="38" rx="6" fill="url(#ws-key)" />
</g>

<!-- MacBook lid: viewBox 1000x560, screen at 76,16 -> 848x530 (16:10).
     Stood upright by components.css. -->
<symbol id="frame-mac-lid" viewBox="0 0 1000 560">
  <!-- Face, edge roll-off, then the rim in two passes: a wide faint
       one for the bloom a bright edge throws into the air around it, a
       fine bright one for the edge itself. Two strokes cost nothing; an
       SVG blur on a symbol used a dozen times does. -->
  <rect x="60" y="0" width="880" height="560" rx="24" fill="url(#ws-alu)" />
  <rect x="60" y="0" width="880" height="560" rx="24" fill="url(#ws-alu-side)" />
  <rect x="61.5" y="1.5" width="877" height="557" rx="22.5" fill="none"
        stroke="url(#ws-rim)" stroke-width="5" stroke-opacity="0.28" />
  <rect x="60.8" y="0.8" width="878.4" height="558.4" rx="23.2" fill="none"
        stroke="url(#ws-rim)" stroke-width="1.6" />
  <path d="M88 1.8 H912" stroke="url(#ws-spec)" stroke-width="2.6" stroke-linecap="round" />

  <!-- Bezel, then the fine catch where black plastic meets glass. Warm,
       because the only light in the room is. -->
  <rect x="70" y="9" width="860" height="542" rx="16" fill="#0a0a0b" />
  <rect x="73.6" y="13.6" width="852.8" height="534.8" rx="11.5" fill="none"
        stroke="#F4C29A" stroke-opacity="0.09" stroke-width="1.2" />

  <!-- Screen well. The screenshot covers this exactly; it is seen only
       while that image is still on its way. The corner radius is echoed
       by --screen-r in components.css, which rounds the screenshot to
       match: a square-cornered image inside a rounded bezel is the
       single loudest tell that a device is drawn rather than
       photographed. -->
  <rect x="76" y="16" width="848" height="530" rx="14" fill="#050506" />

  <!-- The hinge barrel, in the lid's own shadow at the fold. -->
  <path d="M66 546 H934 L930 560 H70 Z" fill="#0d0f12" />
</symbol>

<!-- MacBook deck: viewBox 1000x520, drawn STRAIGHT DOWN. y=0 is the
     hinge, y=520 is the front edge nearest the viewer; components.css
     lays it away from the lid, so this is seen at a hard rake and every
     detail here ends up compressed to a fraction of its drawn height.
     That is the budget this art is drawn to. -->
<symbol id="frame-mac-deck" viewBox="0 0 1000 520">
  <rect x="60" y="0" width="880" height="520" rx="18" fill="url(#ws-deck)" />

  <!-- Speaker grilles either side of the keyboard. -->
  <rect x="92" y="40" width="52" height="248" rx="10" fill="#000" opacity="0.34" />
  <rect x="856" y="40" width="52" height="248" rx="10" fill="#000" opacity="0.34" />

  <!-- Keyboard well, then the rows. -->
  <rect x="150" y="28" width="700" height="256" rx="12" fill="#0b0c0e" />
  <g opacity="0.95">
    <rect x="165" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="214" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="263" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="312" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="361" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="410" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="459" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="508" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="557" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="606" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="655" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="704" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="753" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />
    <rect x="802" y="38" width="40" height="18" rx="4" fill="url(#ws-key)" />

    <use href="#ws-keyrow" y="64" />
    <use href="#ws-keyrow" y="108" />
    <use href="#ws-keyrow" y="152" />
    <use href="#ws-keyrow" y="196" />

    <!-- Bottom row: modifiers, spacebar, modifiers, arrow cluster. -->
    <rect x="160" y="240" width="44" height="38" rx="6" fill="url(#ws-key)" />
    <rect x="209" y="240" width="44" height="38" rx="6" fill="url(#ws-key)" />
    <rect x="258" y="240" width="54" height="38" rx="6" fill="url(#ws-key)" />
    <rect x="317" y="240" width="240" height="38" rx="6" fill="url(#ws-key)" />
    <rect x="562" y="240" width="54" height="38" rx="6" fill="url(#ws-key)" />
    <rect x="621" y="240" width="44" height="38" rx="6" fill="url(#ws-key)" />
    <rect x="699" y="259" width="44" height="19" rx="5" fill="url(#ws-key)" />
    <rect x="748" y="240" width="44" height="19" rx="5" fill="url(#ws-key)" />
    <rect x="748" y="259" width="44" height="19" rx="5" fill="url(#ws-key)" />
    <rect x="797" y="259" width="44" height="19" rx="5" fill="url(#ws-key)" />
  </g>

  <!-- Trackpad: a shade lighter than the deck, with the hairline groove
       that separates it from the palm rest. -->
  <rect x="370" y="316" width="260" height="172" rx="14" fill="#2e3238" />
  <rect x="370.6" y="316.6" width="258.8" height="170.8" rx="13.4" fill="none"
        stroke="#000" stroke-opacity="0.55" stroke-width="1.2" />
  <rect x="372" y="318" width="256" height="168" rx="12.6" fill="none"
        stroke="#fff" stroke-opacity="0.05" stroke-width="1" />

  <!-- The front edge catches the lamp before it rolls under. -->
  <path d="M96 518 H904" stroke="url(#ws-lip)" stroke-width="3" stroke-linecap="round" />
  <rect x="61" y="1" width="878" height="518" rx="17" fill="none"
        stroke="url(#ws-rim)" stroke-width="1.4" />
</symbol>
